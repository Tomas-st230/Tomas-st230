[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-picker"
version = "0.1.0"
description = "Pick the best still frames out of video files and explain why each one was picked."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
# Saliency (cv2.saliency) lives in opencv-contrib only.
saliency = ["opencv-contrib-python>=4.8"]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.4"]

[project.scripts]
framepicker = "framepicker.cli:main"

[tool.setuptools.packages.find]
include = ["framepicker*"]

[tool.setuptools.package-data]
framepicker = ["models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
