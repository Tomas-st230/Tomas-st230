[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-picker"
version = "0.1.0"
description = "Pick the best still frames out of video files and explain why each one was picked."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # opencv-contrib, not plain opencv-python: cv2.saliency (the composition
    # term) lives only in contrib, and upstream is explicit that the two
    # packages share the cv2 namespace and only ONE may be installed in an
    # environment. Shipping contrib as an "optional extra" would therefore
    # break the environment it was added to. Plain opencv-python still works
    # if you install it yourself instead - the composition term is then
    # dropped and the report says so.
    "opencv-contrib-python>=4.8",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.4"]

[project.scripts]
framepicker = "framepicker.cli:main"

[tool.setuptools.packages.find]
include = ["framepicker*"]

[tool.setuptools.package-data]
framepicker = ["models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
